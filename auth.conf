# $DragonFly: src/etc/dma/auth.conf,v 1.1 2008/02/02 18:24:00 matthias Exp $
#
# SMTP authentication entries
# Format: user|my.smarthost.example.com:password
# separator between smarthost and password may be (:| \t)
#
# The AUTHPATH setting in dma.conf must point to this file for it to be used.
#
# The hostname in an authentication entry line is compared with the hostname
# reported by the remote SMTP server.
# This hostname may differ from the hostname used as the SMARTHOST setting.
# For authentication matching, the last two components of the hostnames
# are compared.
#
# For example, an entry for 'web.de' also matches a server reporting itself as
# 'smtp.web.de'.
